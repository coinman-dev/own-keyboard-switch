# cargo-deny configuration: licenses, banned crates, sources.
# Run: cargo deny check

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
all-features = false

[advisories]
yanked = "deny"

[licenses]
# Third-party license allowlist. The workspace's own license is in LICENSE.
allow = [
    "MIT",
    "MIT-0",
    "BSL-1.0",
    "Unlicense",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
]
confidence-threshold = 0.9
# Later stages add dependencies under these licenses.
unused-allowed-license = "allow"

# Fonts embedded by egui: SIL Open Font License and Ubuntu Font Licence allow
# bundling the fonts with software.
[[licenses.exceptions]]
crate = "epaint_default_fonts"
allow = ["OFL-1.1", "Ubuntu-font-1.0"]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
# The program never uses the network.
deny = [
    { crate = "reqwest", reason = "no network access" },
    { crate = "ureq", reason = "no network access" },
    { crate = "hyper", reason = "no network access" },
    { crate = "curl", reason = "no network access" },
    { crate = "isahc", reason = "no network access" },
    { crate = "attohttpc", reason = "no network access" },
    { crate = "openssl", reason = "no network access" },
    { crate = "native-tls", reason = "no network access" },
    { crate = "rustls", reason = "no network access" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
