[package]
name = "okbs-ui"
description = "Own Keyboard Switch: tray, settings window, indicator and localized texts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
crossbeam-channel.workspace = true
egui.workspace = true
image = { version = "0.25.10", default-features = false, features = ["png"] }
okbs-core.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
png = "0.18.1"

[target.'cfg(windows)'.dev-dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.dependencies]
eframe.workspace = true
tray-icon = { workspace = true }
winit.workspace = true
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { workspace = true, features = ["wayland", "x11"] }
tray-icon = { workspace = true, features = ["ksni"] }
winit.workspace = true

[lints]
workspace = true
