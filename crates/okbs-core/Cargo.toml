[package]
name = "okbs-core"
description = "Own Keyboard Switch: platform-independent core (keys, hotkeys, configuration, detection)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[features]
default = ["builtin-data"]
# Embeds the generated language models and Hunspell dictionaries from data/generated.
# Enabled by the application crates; tools/build-lang-data, which produces those files, builds without it.
builtin-data = []

[dependencies]
miniz_oxide.workspace = true
serde.workspace = true
spellbook.workspace = true
serde_ignored.workspace = true
thiserror.workspace = true
toml.workspace = true

[dev-dependencies]
pretty_assertions.workspace = true
tempfile.workspace = true

[lints]
workspace = true
