name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', 'LICENSE*']
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['**/*.md', 'docs/**', 'LICENSE*']
  workflow_dispatch:
    inputs:
      full:
        description: 'Run the full validation before a release or merge'
        type: boolean
        default: true
  workflow_call:
    inputs:
      full:
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    timeout-minutes: 30
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    timeout-minutes: 30
    if: (github.event_name == 'pull_request' && !github.event.pull_request.draft) || inputs.full
    needs: fmt
    name: clippy + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Diagnose smoke test
        shell: bash
        run: cargo run -q -p okbswitch -- --diagnose || true

  deny:
    timeout-minutes: 30
    if: (github.event_name == 'pull_request' && !github.event.pull_request.draft) || inputs.full
    needs: fmt
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
